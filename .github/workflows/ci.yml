name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run tests and publish report
        uses: prashanth-sams/pytest-html-reporter-action@v1
        continue-on-error: true
        with:
          tests: |
            test_api_reqres.py
            test_math_operations.py
            test_playwright_calculator.py
            test_selenium_google.py
          title: py-testing-framework
          history: 'true'
          comment: 'true'
          comment-mode: always
          artifact-name: pytest-html-report

      - name: Prepare GitHub Pages content
        if: always()
        run: |
          mkdir -p pages
          cp pytest_html_report.html pages/index.html

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
